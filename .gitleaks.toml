# gitleaks configuration — MertFormer Titan
#
# [2026-07-30] Added after a full-history scan (gitleaks 8.30.1, 546 commits,
# ~43.9 MB) reported 6 hits, ALL of which were verified false positives before this
# allowlist was written. Every hit was in reports/kpi_report_v1.json under the
# `generic-api-key` rule, matching the JSON field NAME `"key"` rather than any
# credential. The flagged values are human-readable KPI slugs:
#     "key": "kpi01_verify_all"
#     "key": "kpi02_secret_scan"
#     "key": "kpi05_operator_gate"
# Their Shannon entropy is 3.51-3.73, well below what a real API key carries.
#
# The allowlist below is deliberately NARROW: one rule, one path regex. It does not
# disable generic-api-key anywhere else in the tree, and it does not add a global
# stopword list -- a blanket exclusion would be exactly the kind of "make the scanner
# quiet" change that lets a real leak through later.
#
# Run the full-history scan with:
#     gitleaks detect --source . --log-opts="--all" --redact
#
# Note this is SEPARATE from scripts/secret_scan.py, which is the repo's own
# working-tree gate wired into scripts/verify_all.sh. gitleaks covers git HISTORY;
# secret_scan.py covers the current tree plus this project's own token patterns.

title = "MertFormer Titan gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "KPI slugs in reports/kpi_report_v1.json are field names, not credentials"
paths = ['''reports/kpi_report_v1\.json''']
regexes = ['''"key":\s*"kpi[0-9]+_[a-z0-9_]+"''']
