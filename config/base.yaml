# Base configuration (Build 30)
#
# !! INERT BY DEFAULT — EDITING THIS FILE CHANGES NOTHING ON ANY NORMAL RUN !!
# config/config.py `_load_config_overlays()` reads this file ONLY when the
# MERTFORMER_CONFIG environment variable is explicitly set, and nothing in the repo's
# own tooling (verify_all.sh / one_command_full_sop.sh / final_one_shot.sh /
# zero_touch_start.sh / scripts/preflight_run.py) ever sets it. To change the canonical
# training config, edit config/config.py or use the TITAN_* env overrides.
# Documented 2026-07-08. Deliberately NOT wired to load by default — that would be a
# real behavior change requiring its own review.
#
# Notes:
# - This file provides a stable baseline.
# - Any key not present here falls back to config/config.py defaults.

model_name: MertFormer_Titan_S25_Prod
version: v1.0-TITAN-BUILD30-V2
seed: 1453

# Dimensions
vocab_size: 128256
max_seq_len: 4096
hidden_size: 2048
intermediate_size: 5632
num_layers: 18
num_hidden_layers: 18
num_heads: 16
num_attention_heads: 16
num_kv_heads: 8
head_dim: 128
rms_norm_eps: 1.0e-6
dropout: 0.1
rope_theta: 100000.0
rope_base: 100000.0

# BitNet
use_bitnet: true
weight_quantization: rms_per_channel  # per-row RMS scale + ternary {-1,0,+1} (layers/bitlinear.py); matches config.py default
activation_bits: 8

# MoE
use_moe: true
num_experts: 8
num_experts_per_tok: 2
router_aux_loss_coef: 0.02
aux_loss_coef: 0.02
moe_every_n_layers: 3
use_switch_loss: true
router_jitter: 0.02
router_jitter_boost: 0.1

# Liquid
use_liquid: true
liquid_solver: cfc
liquid_layers_idx: [4, 10, 16]
liquid_every_n_layers: 0
z_loss_coef: 0.0001
liquid_warmup_steps: 10000
liquid_spike_threshold: 5.0
liquid_spike_patience: 3
liquid_spike_cooldown_steps: 200

# Distillation
teacher_model_id: meta-llama/Llama-3.3-70B-Instruct
distill_alpha: 0.8
distill_intermediate_layers: true
teacher_temp: 1.0
use_precomputed_logits: true
precomputed_logits_path: ./datasets/logits/

# Training
batch_size: 128
learning_rate: 0.0015
weight_decay: 0.1
warmup_steps: 3000
max_steps: 45000
epoch_mode: false
min_lr_ratio: 0.1
grad_clip: 2.0
early_stop_patience: 5
val_check_interval: 1000
label_smoothing: 0.1
attention_dropout: 0.1

# Optimizations
use_gradient_checkpointing: true
use_torch_compile: false
torch_compile_mode: max-autotune
use_8bit_adam: true
use_galore: true
use_amp: true
use_accelerate: true

# IO
output_dir: ./checkpoints/mertformer_titan_prod
save_dir: ./checkpoints/mertformer_titan_prod
log_interval: 10   # matches config.py default (TITAN_LOG_INTERVAL); per-step logging adds 45K I/O overhead
save_interval: 1000
export_format: onnx_dynamic

# Data loader
freeze_core_layers: false
dataloader_num_workers: 8
dataloader_prefetch_factor: 2
