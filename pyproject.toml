[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mertformer-sdk"
version = "0.1.0"
description = "MertFormer Titan SDK"
readme = "README.md"
# Review-ready baseline: Python 3.11 (ecosystem + pygame wheels + fewer surprises).
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Mert Yünlü"}]
dependencies = [
  "torch>=2.0",
  "transformers>=4.30",
  "datasets>=2.12",
  "accelerate>=0.20",
  "sentencepiece>=0.1.99",
  "protobuf>=3.20",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "chess>=1.11",
  "psutil>=5.9",
  "networkx>=3.1",
  "huggingface_hub>=0.20",
  "scipy>=1.10",
]

[project.optional-dependencies]
cuda = ["triton>=2.1", "bitsandbytes>=0.41.0", "flash-attn>=2.5.0"]
onnx = [
  "onnx>=1.14",
  "onnxruntime>=1.16",
  "onnxscript>=0.1.0",
  "onnx-simplifier>=0.4.33; python_version < \"3.13\"",
]
cli = ["tqdm>=4.65"]
train = ["peft>=0.4.0", "wandb>=0.15.0", "galore-torch>=0.0.1", "zstandard>=0.21"]
dev = [
  "pytest>=7.3",
  "pytest-cov>=4.1",
  "ruff>=0.6.0",
  "mypy>=1.10,<2",
]
demo = ["pygame==2.6.1"]

[project.scripts]
mertformer = "mertformer_sdk.cli:main"

[tool.setuptools]
packages = [
  "mertformer_sdk",
  "mertformer_sdk.kernels",
  "mertformer_sdk.kernels.cpp",
  "mertformer_sdk.kernels.metal",
  "mertformer_sdk.kernels.vulkan",
  "mertformer_sdk.kernels.npu",
  "mertformer_sdk.utils",
  "config",
  "layers",
  "model",
  "utils",
  "train",
  "orchestrator",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep CI lint lightweight and low-risk (no massive reformat churn).
# NOTE: The existing codebase contains many legacy/experimental scripts with
# unused imports and other low-signal warnings. CI focuses on syntax errors and
# undefined names (high-signal).
select = ["E9", "F821", "F822", "F823"]

[tool.mypy]
# Scoped, additive type gate: only the files listed below are checked.
# follow_imports=silent analyzes imported modules (config.config,
# layers.bitlinear, torch, ...) for type information but reports no errors
# for them, so the gate stays green while coverage grows file by file.
python_version = "3.11"
follow_imports = "silent"
ignore_missing_imports = true
files = [
  "orchestrator/telemetry.py",
  "economics/flops_estimator.py",
  "train/continual_adapter.py",
  "layers/mla.py",
  "layers/mertformer_block.py",
  "train/trainer_core.py",
  "train/trainer_data.py",
  "train/trainer_eval.py",
  "model/transformers.py",
  "eval/agentic_suite.py",
  "eval/generalization_suite.py",
  "eval/report_builder.py",
  "utils/tokenizer_resolver.py",
  "utils/safety.py",
  "utils/dataset_registry.py",
]

[tool.coverage.run]
branch = true
source = ["config", "layers", "model", "train", "orchestrator", "utils", "eval", "economics"]
omit = ["*/tests/*", ".titan-venv/*", "scripts/*onefile*", "*/mac_simulation.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__."]
# Informational only — coverage is NOT a CI gate (kept off the 365-passed/4-skipped path).
