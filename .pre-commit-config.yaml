# Local fast-fail mirror of the CI lint gate (scripts/verify_all.sh runs `ruff check`).
# Install:  pip install pre-commit && pre-commit install
# These are developer-side hooks only; CI remains the source of truth.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5   # keep in sync with constraints.txt (ruff==0.15.5)
    hooks:
      - id: ruff   # mirrors CI `ruff check`
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
