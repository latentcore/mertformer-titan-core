name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Secret scan
        run: |
          python scripts/secret_scan.py

      - name: Unicode Path Guard
        run: |
          python scripts/unicode_path_guard.py --root . --out reports/unicode_path_guard_report.json --fail-on-hit

      - name: Ruff
        run: |
          python -m ruff check .

      - name: Verify all
        env:
          TITAN_OFFLINE: "1"
          TITAN_WANDB: "0"
          TITAN_PYTHON: "python3"
        run: |
          bash scripts/verify_all.sh

      - name: Hardening Bundle
        run: |
          python scripts/hardening_bundle.py

      - name: Markdown Quality Report
        run: |
          python scripts/md_quality_gate.py --root . --out reports/md_lint_report.json

      - name: Linkcheck Report
        run: |
          python scripts/linkcheck_gate.py --root . --out reports/linkcheck_report.json

      - name: Duplicate Zip Guard
        run: |
          python scripts/duplicate_zip_guard.py --root packages --root artifacts --out reports/duplicate_zip_guard_report.json

      - name: Sync Manifest
        run: |
          python scripts/sync_manifest.py --root . --manifest reports/release_manifest.json --structure docs/PROJECT_STRUCTURE.md --matrix reports/file_sync_matrix.json --sync-report reports/project_structure_sync_report.json --policy-report reports/policy_sync_report.json
